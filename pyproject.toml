[project]
name = "museai"
version = "1.0.0"
description = "MuseAI v1 — an outline-driven autonomous fiction drafter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "quart",
    "langgraph",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "jinja2",
    "tiktoken",
    "ddgs",
    "python-dotenv",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["museai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
