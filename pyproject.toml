[project]
name = "museai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "quart",
    "langgraph",
    "pydantic>=2.0",
    "pydantic-settings",
    "jinja2",
    "pyyaml",
    "chromadb",
    "tiktoken",
    "graphiti-core",
    "falkordblite; sys_platform != 'win32'",
    "numpy",
    "httpx",
    "typing-extensions",
    "transformers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "integration: live model-server checks driven by config.yaml",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "streamlit>=1.40.0",
]