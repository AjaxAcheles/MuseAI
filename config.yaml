project_id: the-borrowed-ladder

endpoint:
  # 11435, not the default 11434. On 2026-08-21 the only server on 11434 was
  # systemd's ollama.service, which runs as User=ollama and therefore reads the
  # empty /usr/share/ollama/.ollama/models; the real 61 GB store lives under
  # /home/imarg. A second server owned by imarg serves that store on 11435:
  #   OLLAMA_HOST=127.0.0.1:11435 OLLAMA_CONTEXT_LENGTH=16384 ollama serve
  base_url: http://127.0.0.1:11435/v1
  api_key: ollama
  # Chosen 2026-08-20 by A/B against hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M
  # -GGUF:Q4_K_M on the seed's own comprehension trap: who borrowed the ladder.
  # Qwythos inverted it on the first live beat — it drafted Ida as the one who
  # "borrowed herself into Nell's gutter" — which the continuity critic caught,
  # costing a full revise cycle on beat one. Across three samples at the
  # drafter's own temperature, Qwythos never anchored ownership either way;
  # this model stated it correctly in all three. It is also the faster of the
  # two (23.6 s vs 31.7 s on a fixed probe) and the only other 9B here that
  # returns valid planner JSON. It does run long — one sample reached 1,274
  # words against a 400-600 ask — so watch draft length in the run log.
  # Switched from qwen3.5:9b on 2026-08-21. Probed on this host before the run:
  # it emits valid planner JSON, it emits tool calls (unlike the Gemma-The-Writer
  # 9B, which returns HTTP 400 "does not support tools"), and it honours
  # `reasoning_effort: none` on /v1 — 0 hidden reasoning chars on a 683-word
  # draft, so the empty-verdict stall the five roles were tuned against does not
  # return with it. It is slower: 14.2 generated tok/s against a realistic
  # 9,370-token prompt, ~46 s per drafting call, because at IQ2_XXS the 9.9 GB of
  # weights do not quite fit the 9.6 GB this 12 GB card leaves free and ~11% of
  # the layers run on CPU. That is the price of the extra capability, and there
  # is no quantisation of it that fits fully on this card.
  model_name: hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ2_XXS
  tokenizer_family: char_heuristic
  request_timeout: 60
  # Raised from 300 for the 27B on 2026-08-21. This is the gap allowed between
  # streamed chunks, and the first chunk of a run waits on a cold load of 9.9 GB
  # of weights plus the prefill of a ~9k-token prompt. 300 s was never observed
  # to bind, but the margin over a cold load is much thinner than it was for a
  # 6.6 GB model, and the cost of the extra headroom is nil.
  stream_read_timeout: 600
  # Fallback only: every one of the five agent roles overrides this below.
  temperature: 0.8
  # Also a fallback, but it must be set here as well as on the five roles. The
  # Settings page's "Test connection" probe calls this bare endpoint directly,
  # not any agent, with an 8-token budget. Left unset on 2026-08-20, this model
  # spent all eight tokens on hidden reasoning and returned an empty string, so
  # the probe reported a broken endpoint while generation itself was fine.
  reasoning_effort: none
  # Leave null. With context_window set, max_tokens is sent as the window's
  # actual remainder after the prompt, so long prose is never capped early.
  max_output_tokens: null
  # Retry policy. N attempts means N-1 sleeps; the last backoff value repeats
  # if there are more retries than entries.
  max_attempts: 3
  retry_backoff_seconds: [5.0, 15.0]
  # Ollama serves its own small default (a few thousand tokens) unless told
  # otherwise, and it discards the overflow from the LEFT — taking the system
  # message with it. So this must match what the server actually serves.
  #
  # Lowered from 20000 to 16384 for the 27B on 2026-08-21. Under 20000 this model
  # ran 87% on GPU; under 16384 it runs 89%, and on the SAME 9,370-token prompt
  # that is 45.7 s against 54.0 s — an 18% speedup. The window that was given up
  # is window this project never uses: across the 135 LLM calls of the 2026-08-20
  # run, the largest prompt any of the five roles built was 9,559 tokens, with a
  # median of 6,220. 16384 clears the observed maximum with room for the critic's
  # 6144-token reservation on top of it.
  #
  # Set it on the server too — the run script does this:
  #   OLLAMA_HOST=127.0.0.1:11435 OLLAMA_CONTEXT_LENGTH=16384 ollama serve
  # and CONFIRM with `ollama ps` that the CONTEXT column reads 16384.
  #
  # Do not treat extra_body as a fallback: verified against Ollama 0.32.1, the
  # /v1 compatibility endpoint discards the `options` block silently, so num_ctx
  # below does nothing here. The env var is the only lever. It is left in place
  # because it is honoured on the native /api/chat endpoint, and it is harmless
  # where it is not — but on 2026-07-24 it was mistaken for a working safety net
  # while the server quietly served 4096 against this declared 16384, which
  # starved every role of output room. `generation.served_window_mismatch_fraction`
  # now catches that gap and names both numbers.
  context_window: 16384
  extra_body:
    options:
      num_ctx: 16384
  # Tokens kept free for generation. Prompts are trimmed to leave at least this
  # much room. Raised from the 1024 default because a prose beat needs more
  # headroom than a JSON verdict; per-agent values are set under `agents:`.
  output_reservation: 2048

generation:
  word_count_target: null
  narrative_person: third
  revision_retry_cap: 4
  # Must stay above tool_call_cap, or one tool can eat the whole agent loop and
  # leave no iterations to answer with.
  max_agent_iterations: 8
  recent_prose_beats: 4
  # Soft ceiling on the assembled drafting context. Must leave room under
  # context_window for output: 10000 + the critic's 6144 reservation (now the
  # largest of the five roles) fits inside 16384 with slack for tokenizer drift
  # (char_heuristic is an estimate, not an exact count).
  #
  # Lowered from 14000 with context_window on 2026-08-21, and it costs nothing:
  # the largest prompt actually assembled across the 135 calls of the 2026-08-20
  # run was 9,559 tokens and the median was 6,220, so 14000 was a ceiling this
  # project never reached. 10000 still clears that observed maximum.
  context_token_budget: 10000
  # Raised from 0.25 on 2026-08-19. In the 2026-08-18 full run, 13 of 18 audits
  # breached 0.25 — against this model's prose it was not a defect detector, it
  # was the default state, and it generated parks on marginal readings (one beat
  # parked on a single passive sentence out of six). 0.4 keeps the guard for
  # genuinely passive-heavy prose without firing on the baseline.
  passive_voice_threshold: 0.4
  critic_parse_retries: 2
  critic_degrade_threshold: 3
  planner_parse_retries: 2
  # A cut-off reply whose served token total falls below this fraction of
  # context_window is reported as a server/config mismatch, naming both numbers.
  # This is the guard for the 2026-07-24 failure: OLLAMA_CONTEXT_LENGTH was
  # unset, Ollama served 4096 against a declared 16384, and every role failed
  # with generic "shorten the prompt" advice that would never have fixed it.
  served_window_mismatch_fraction: 0.9
  repetition_threshold: 0.9
  repetition_min_run: 3
  repetition_allowlist: []

  # Below this many sentences, density-based gates (passive voice, emotion
  # words, tic phrases) are skipped entirely: a 3-sentence beat can't support
  # a 25% proportion without quantizing to 0/33/67/100, which makes the
  # threshold effectively unreachable in either direction.
  passive_min_sentences: 6

  # Proportion of a beat's sentences that may name an emotion outright.
  # Matched whole-word and case-insensitively, so inflections need listing
  # ("fear" does not match "feared"). Loosened from 0.30 to offset a
  # vocabulary that grew 18 -> 115: the additions are mostly precision
  # (catching "feared" where "fear" missed), but a few are common enough in
  # dialogue to fault honest prose.
  emotion_word_threshold: 0.40
  emotion_words:
  # fear
  - fear
  - feared
  - fearful
  - afraid
  - terror
  - terrified
  - terrifying
  - dread
  - dreaded
  - panic
  - panicked
  - horror
  - horrified
  - alarm
  - alarmed
  - fright
  - frightened
  - scared
  - nervous
  - nervously
  - anxiety
  - anxious
  - apprehension
  - uneasy
  - unease
  - worried
  - worry
  # anger
  - rage
  - enraged
  - fury
  - furious
  - anger
  - angry
  - angrily
  - irritation
  - irritated
  - annoyed
  - annoyance
  - resentment
  - resentful
  - indignation
  - indignant
  - hatred
  - loathing
  - contempt
  - spite
  - bitterness
  - bitterly
  # sadness
  - grief
  - grieving
  - sorrow
  - sorrowful
  - despair
  - despairing
  - misery
  - miserable
  - anguish
  - anguished
  - sadness
  - sad
  - sadly
  - melancholy
  - heartbreak
  - heartbroken
  - devastated
  - devastation
  - loneliness
  - lonely
  - regret
  - remorse
  # shame
  - guilt
  - guilty
  - shame
  - ashamed
  - humiliation
  - humiliated
  - embarrassment
  - embarrassed
  - mortified
  # joy
  - joy
  - joyful
  - happiness
  - happy
  - happily
  - elation
  - elated
  - euphoria
  - euphoric
  - delight
  - delighted
  - glee
  - gleeful
  - excitement
  - excited
  - excitedly
  - relief
  - relieved
  # other named states
  - confusion
  - confused
  - disgust
  - disgusted
  - jealousy
  - jealous
  - envy
  - envious
  - hopeless
  - hopelessness
  - pride
  - proud
  - longing
  - yearning
  - desperation
  - desperate
  - frustration
  - frustrated

  # Proportion of a beat's sentences that may lean on a stock gesture or
  # abstract shorthand. Raised from 0.15, which was calibrated against 17
  # phrases and is far tighter against 113. If legitimate prose still gets
  # faulted, raise this further rather than gutting the vocabulary.
  tic_phrase_threshold: 0.40
  tic_phrases:
  # observed in this project's own drafts
  - trembling
  - trembled
  - deep breath
  - shaky breath
  - tears welled
  - welled with tears
  - eyes filled with tears
  - traced the handwriting
  - traced the letters
  - traced the words
  - heavy silence
  - silence hung
  - the weight of
  - shared history
  - legacy
  - closure
  - bittersweet
  # stock cardiac / respiratory tells
  - heart pounded
  - heart pounding
  - heart hammered
  - heart raced
  - heart racing
  - heart skipped
  - pulse quickened
  - breath caught
  - breath hitched
  - caught her breath
  - caught his breath
  - let out a breath
  - let out a sigh
  - released a breath
  - exhaled slowly
  - breath she didn't know
  - breath he didn't know
  # throat / stomach tells
  - lump in her throat
  - lump in his throat
  - throat tightened
  - throat closed
  - stomach lurched
  - stomach dropped
  - stomach churned
  - stomach twisted
  - knot in her stomach
  - knot in his stomach
  # stock gestures
  - clenched her jaw
  - clenched his jaw
  - jaw tightened
  - clenched her fists
  - clenched his fists
  - furrowed brow
  - brow furrowed
  - raised an eyebrow
  - arched an eyebrow
  - quirked an eyebrow
  - ran a hand through her hair
  - ran a hand through his hair
  - raked a hand through
  - bit her lip
  - bit his lip
  - chewed her lip
