  - wave of emotion

  # A four-chapter run decomposed into 1/3/1/1 beats, leaving three chapters
  # with no meaningful internal progression. Ask once for a real decomposition
  # before accepting the planner's answer; the retry remains bounded.
  min_beats_per_chapter: 3
  planner_decomposition_retries: 1

  # Emotional arc of a planned chapter. A chapter shorter than
  # intensity_min_beats has no arc to shape and is never flagged as flat.
  # flat_fraction was 0.8 — permissive enough that a chapter could be 4/5
  # high-arousal and never trip. 0.6 forces actual valleys between peaks, and
  # the extra retry gives the planner a second chance to find them.
  planner_intensity_retries: 2
  intensity_hot_threshold: 0.6
  intensity_flat_fraction: 0.6
  intensity_min_beats: 3

  # Half-width of the PAD neutral band: where the 3x3x3 grid boundaries fall,
  # and so which pad_baselines.json entry a beat's target PAD lands on.
  pad_band_threshold: 0.33

  # How much offending prose is quoted back. audit_quote_chars is what the
  # reviser matches against to locate a span, so too short makes spans
  # ambiguous and too long wastes the revision prompt.
  audit_quote_chars: 240
  # A clean prose verdict must declare itself in its first sentence; this is
  # the whole-reply bound that still permits a concise explanation afterwards.
  critic_verdict_max_chars: 700
  # A 397-word beat produced as many as eight copies of one code. Keep the
  # first two per code: enough for distinct evidence, not enough for a burst to
  # dominate routing's failure count.
  critic_max_findings_per_code: 2
  # Separate budget for the full offender list a density failure appends to its
  # suggested_fix. That list is instruction prose, not a span to match, and it
  # carries every offending sentence — sizing it at audit_quote_chars (one
  # quote) would show the reviser two of five and let it "fix" the finding
  # without moving the proportion.
  audit_offender_list_chars: 1200

  research_mode: false
  # Was 6, equal to max_agent_iterations — one tool could consume the entire
  # loop and leave nothing to answer with. Kept well below it now.
  tool_call_cap: 3
  tool_timeout: 30.0

# How the revision node decides a critic's quoted span is trustworthy enough to
# rewrite surgically instead of regenerating the whole beat.
revision:
  fuzzy_threshold: 0.8
  min_span_chars: 4
  span_growth_limit: 3.0
  span_growth_slack_chars: 400
  echo_min_words: 8
  # Seven of seven span rejections in the 2026-08-20 run echoed surrounding
  # prose. Give that local rewrite one bounded correction before regenerating
  # the entire beat, which would discard the paid span result and invite drift.
  span_rejection_retries: 1
  # A 2026-08-21 full rewrite collapsed 988 words to 150. Reject a regenerated
  # beat below this share of its source: fewer findings cannot pay for deleted
  # events, scenes, or dialogue.
  full_rewrite_min_word_ratio: 0.6
  # The same collapse briefly became the running best on finding count alone.
  # A substantially shorter candidate cannot replace that best for that reason.
  best_seen_min_word_ratio: 0.75
  # Let a rejected short rewrite correct its lost scope once before keeping the
  # original beat instead of committing a collapsed stub.
  full_rewrite_retries: 1

# Retrieval budgets for the agents' read-only story tools. Each trades context
# spend against how much true story an agent can see.
tools:
  recent_commit_closing_words: 40
  character_dialogue_samples: 8
  character_sample_chars: 200
  search_snippet_chars: 300
  search_phrase_bonus: 25
  repetition_max_matches: 10
  repetition_snippet_chars: 240
  repetition_phrase_max_words: 12
  check_draft_max_quotes: 5
  check_draft_quote_chars: 240

# Per-agent overrides of the shared endpoint above. Sparse: only the keys named
# here differ, everything else is inherited.
#
# One temperature cannot serve all five roles. The planners and the critic emit
# JSON, where heat buys nothing and costs parse failures — that is what
# planner_parse_retries and critic_parse_retries were absorbing. The drafter is
# the only role whose whole job is invention, so it is the only one that should
# run hot. output_reservation follows the same logic: prose needs room to land,
# a verdict does not.
#
# To split roles across machines, add `base_url` and `api_key: "${VAR}"` here —
# the PLANNER_*/DRAFTER_*/CRITIC_* variables already in .env are wired nowhere
# until they are referenced from this block.
#
# `reasoning_effort: none` is set on the critic and the drafter only, because
# those are the two roles where it was actually measured (see their notes). The
# planners are deliberately left alone: every run in that session reused an
# existing plan, so neither planner ever ran under either setting and there is
# no evidence either way. They emit JSON like the critic does, so the same win
# is plausible — measure before assuming it.
agents:
  chapter_planner:
    temperature: 0.4          # structural JSON: obligations and chapter shape
    output_reservation: 2048
    # Same measurement as the drafter and critic, extended to the planners on
    # 2026-08-19. In the 2026-08-18 run the three agents left unset were the
    # entire remaining latency cost: 10,008 thinking chars here at 32.7 s mean.
    reasoning_effort: none
  beat_planner:
    temperature: 0.5          # JSON, but the intents need some invention
    output_reservation: 2048
    # 16,229 thinking chars at 40.5 s mean before this. See chapter_planner.
    reasoning_effort: none
  drafter:
    temperature: 0.9          # prose — the one role that should run hot
    output_reservation: 3072
    # Counter-intuitive but measured (2026-08-18): hidden reasoning was crowding
    # the prose out of the output budget. With reasoning on, one beat came back
    # as 29 words costing 5,254 completion tokens; with it off, 83 words for 99.
    # Deliberation is not what writes the sentence, and here it was starving it.
    reasoning_effort: none
  reviser:
    temperature: 0.7          # prose, but constrained by the failures it answers
    # The critic's empty-verdict stall, in the agent left unconfigured. On
    # 2026-08-18 at 14:34:22 the reviser hit finish_reason='length' after 125.9 s
    # having spent all 9,619 completion tokens on hidden reasoning with no answer
    # text. That aborted the run mid-arc and cost a full replan. Across the run it
    # produced 46,694 thinking chars and 635 s — 53% of all LLM time, against the
    # critic's 157 s.
    reasoning_effort: none
    # Unlike the critic, the reviser had no cap at all: it was handed max_tokens
    # of 9,240-13,870 (the context window minus the prompt), so a runaway reply
    # failed slowly instead of fast. Same constraint as the critic — setting
    # max_output_tokens skips the client's room calculation, so the reservation
    # must be at least the cap, and the two move together.
    max_output_tokens: 4096
    output_reservation: 4096
  critic:
    temperature: 0.3          # judgement, emitted as JSON: heat is pure downside
    # See the long note below: this is the fix for the empty-verdict stall.
    reasoning_effort: none
    # A [] verdict needs ~10 tokens; observed useful replies land under 1600.
    # Without a cap, a stuck critic burns its whole grant on <think> tokens and
    # returns finish_reason='length' with zero text (llm_io.log:82, 2026-07-24).
    # The reservation must be at least the cap: setting max_output_tokens skips
    # the client's room calculation entirely, so the reservation is the only
    # space the prompt trimmer actually guarantees.
    #
    # This was 2048/2048 in v0.2.3; raised to 4096 on 2026-07-25 after the live
    # run showed a 2048 cap alone was not enough headroom — 42% of post-fix
    # critic wall clock was spent hitting it with zero answer text (empty_reply
    # in fsm.log). The cap was widened as a mitigation, and it never worked:
    # truncation stayed at ~37% while every failure just got slower.
    #
    # RESOLVED 2026-08-18 by `reasoning_effort` below, not by the cap. The
    # earlier note here said disabling reasoning "does not survive the wire" and
    # that only native /api/chat's `think: false` suppresses it. That was half
    # right and led the investigation astray. Measured live against Ollama
    # 0.32.1 on a real ~3.2k-token critic prompt with tools attached:
    #
    #   extra_body chat_template_kwargs / `think` / a "/no_think" suffix
    #                                     -> all ignored on /v1, as documented
    #   reasoning_effort: none            -> HONOURED on /v1
    #
    #   as shipped         43.6 s, finish_reason='length', 4096 tokens, no text
    #   reasoning_effort   1.7 s, finish_reason='stop', 2 tokens, verdict "[]"
    #
    # `reasoning_effort` is a standard OpenAI-compatible request field, so this
    # needs no second wire adapter and no /api/chat support. In a live run it
    # took `empty_reply` from 2 per beat to 0 and the beat from 209 s to 32 s.
    #
    # Five legitimate multi-finding verdicts hit 4096 in the 2026-08-20 run,
    # while empty_reply stayed at zero. The older 55-600-token sample must not be read
    # as headroom. Watch `empty_reply` in fsm.log if the model is ever changed —
    # this finding is model-specific and was false for qwen3.5:9b.
    #
    # Side effect: window_budget(critic endpoint) = context_window -
    # output_reservation drops from 14336 to 12288 tokens — the room
    # `_fits_window` (critics.py) allows a parse-retry prompt to occupy before
    # dropping carried tool turns. Coincidentally close to but independent of
    # generation.context_token_budget (14000, drafting/revise only — the critic
    # doesn't read that key). 12288 still comfortably covers observed critic
    # prompts (~6.4k tokens), but a beat with heavier tool use than any seen so
    # far could now hit `retry_context_dropped` where it never has.
    # Five legitimate multi-finding verdicts hit 4096 in the 2026-08-20 run,
    # with zero empty replies. Reasoning was already off, so the cap bound real
    # answers rather than runaway reasoning; keep these two values together.
    output_reservation: 6144
    max_output_tokens: 6144

log_level: INFO
host: 127.0.0.1
port: 8000
db_path: data/museai.db
event_log_path: data/events.jsonl
allow_reset: true
web_search_timeout: 10
