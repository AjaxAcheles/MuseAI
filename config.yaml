  - squared his shoulders
  - swallowed hard
  - nodded slowly
  - shook her head slowly
  - shook his head slowly
  # eye-contact and chill tells
  - eyes widened
  - eyes narrowed
  - eyes darted
  - met her eyes
  - met his eyes
  - held her gaze
  - held his gaze
  - locked eyes
  - blood ran cold
  - blood turned to ice
  - chill ran down
  - shiver ran down
  - shiver down her spine
  - shiver down his spine
  # voice tells
  - barely above a whisper
  - voice cracked
  - voice broke
  - voice barely a whisper
  # abstract shorthand and AI-prose markers
  - a testament to
  - tapestry of
  - symphony of
  - dance of
  - echoes of
  - a reminder that
  - served as a reminder
  - palpable
  - nestled
  - bustling
  - in that moment
  - in that instant
  - little did
  - unbeknownst to
  - couldn't help but
  - couldn't shake the feeling
