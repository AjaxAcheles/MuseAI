# Raw runtime configuration.
# All values are proposed defaults and are not validated until the config loader is built.

endpoints:
  planner:
    base_url: "http://localhost:11434/v1"
    model_name: "cryptidbleh/gemma4-claude-opus-4.6:latest"
    tokenizer_family: "tiktoken"
    supports_concurrent_critics: false
    grammar_constraint_strategy: "json_schema"

  drafter:
    base_url: "http://localhost:11434/v1"
    model_name: "cryptidbleh/gemma4-claude-opus-4.6:latest"
    tokenizer_family: "tiktoken"
    supports_concurrent_critics: false
    grammar_constraint_strategy: "json_mode"

  critic:
    base_url: "http://localhost:11434/v1"
    model_name: "cryptidbleh/gemma4-claude-opus-4.6:latest"
    tokenizer_family: "tiktoken"
    supports_concurrent_critics: true
    grammar_constraint_strategy: "json_schema"

  pad_translator:
    base_url: "http://localhost:11434/v1"
    model_name: "cryptidbleh/gemma4-claude-opus-4.6:latest"
    tokenizer_family: "tiktoken"
    supports_concurrent_critics: false
    grammar_constraint_strategy: "json_schema"

  craft_consultant:
    base_url: "http://localhost:11434/v1"
    model_name: "cryptidbleh/gemma4-claude-opus-4.6:latest"
    tokenizer_family: "tiktoken"
    supports_concurrent_critics: false
    grammar_constraint_strategy: "json_schema"

thresholds:
  stylometric_drift_threshold: 0.12 # proposed default to be calibrated
  pad_ewma_alpha: 0.35 # proposed default to be calibrated
  coreference_confidence_floor: 0.65 # proposed default to be calibrated
  cluster_similarity_threshold: 0.65 # proposed default to be calibrated
  passive_voice_density: 0.25 # proposed default to be calibrated
  voice_evolution_l2_cap: 0.30 # proposed default to be calibrated

context:
  token_budget: 8000 # provisional, uncalibrated assembled-package ceiling
  coreference_high_confidence: 0.85 # provisional, uncalibrated confirmed-fact band
  coreference_mid_confidence: 0.50 # provisional, uncalibrated epistemic-belief band

runtime:
  model_validate_retry_cap: 3 # proposed default to be calibrated
  headless_mode: false
  beats_per_scene_min: 3 # proposed default to be calibrated
  word_count_target: 80000 # proposed default to be calibrated
  inference_timeout_seconds: 120 # seconds; covers cold model-load on local servers

logging:
  log_level: "INFO"
