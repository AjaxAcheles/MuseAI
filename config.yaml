project_id: the-borrowed-ladder

endpoint:
  base_url: http://127.0.0.1:11434/v1
  api_key: ollama
  model_name: qwen3.5:9b
  tokenizer_family: char_heuristic
  request_timeout: 60
  stream_read_timeout: 300
  # Fallback only: every one of the five agent roles overrides this below.
  temperature: 0.7
  # Leave null. With context_window set, max_tokens is sent as the window's
  # actual remainder after the prompt, so long prose is never capped early.
  max_output_tokens: null
  # Retry policy. N attempts means N-1 sleeps; the last backoff value repeats
  # if there are more retries than entries.
  max_attempts: 3
  retry_backoff_seconds: [5.0, 15.0]
  # qwen3.5:9b is architecturally a 256k-context model, but Ollama serves its
  # own small default (a few thousand tokens) unless told otherwise, and it
  # discards the overflow from the LEFT — taking the system message with it.
  # 16384 is sized for a 12 GB card: ~6.6 GB weights (Q4_K_M) plus KV cache
  # still fits on the GPU, and spilling KV to system RAM would cost far more
  # speed than the extra context is worth.
  #
  # This value must match what the server actually serves. Set it there too:
  #   setx OLLAMA_CONTEXT_LENGTH 16384
  # then fully quit and relaunch Ollama (setx only reaches processes started
  # after it runs), and CONFIRM with `ollama ps` that the CONTEXT column reads
  # 16384 and PROCESSOR still says 100% GPU.
  #
  # Do not treat extra_body as a fallback: verified against Ollama 0.32.1, the
  # /v1 compatibility endpoint discards the `options` block silently, so num_ctx
  # below does nothing here. The env var is the only lever. It is left in place
  # because it is honoured on the native /api/chat endpoint, and it is harmless
  # where it is not — but on 2026-07-24 it was mistaken for a working safety net
  # while the server quietly served 4096 against this declared 16384, which
  # starved every role of output room. `generation.served_window_mismatch_fraction`
  # now catches that gap and names both numbers.
  context_window: 16384
  extra_body:
    options:
      num_ctx: 16384
  # Tokens kept free for generation. Prompts are trimmed to leave at least this
  # much room. Raised from the 1024 default because a prose beat needs more
  # headroom than a JSON verdict; per-agent values are set under `agents:`.
  output_reservation: 2048

generation:
  word_count_target: null
  revision_retry_cap: 4
  # Must stay above tool_call_cap, or one tool can eat the whole agent loop and
  # leave no iterations to answer with.
  max_agent_iterations: 8
  recent_prose_beats: 4
  # Soft ceiling on the assembled drafting context. Must leave room under
  # context_window for output: 12000 + the drafter's 3072 reservation still
  # fits inside 16384 with slack for tokenizer drift (char_heuristic is an
  # estimate, not an exact count).
  context_token_budget: 12000
  passive_voice_threshold: 0.25
  critic_parse_retries: 2
  critic_degrade_threshold: 3
  planner_parse_retries: 2
  # A cut-off reply whose served token total falls below this fraction of
  # context_window is reported as a server/config mismatch, naming both numbers.
  # This is the guard for the 2026-07-24 failure: OLLAMA_CONTEXT_LENGTH was
  # unset, Ollama served 4096 against a declared 16384, and every role failed
  # with generic "shorten the prompt" advice that would never have fixed it.
  served_window_mismatch_fraction: 0.9
  repetition_threshold: 0.9
  repetition_min_run: 3
  repetition_allowlist: []

  # Proportion of a beat's sentences that may name an emotion outright.
  # Matched whole-word and case-insensitively, so inflections need listing
  # ("fear" does not match "feared"). Loosened from 0.30 to offset a
  # vocabulary that grew 18 -> 115: the additions are mostly precision
  # (catching "feared" where "fear" missed), but a few are common enough in
  # dialogue to fault honest prose.
  emotion_word_threshold: 0.35
  emotion_words:
  # fear
  - fear
  - feared
  - fearful
  - afraid
  - terror
  - terrified
  - terrifying
  - dread
  - dreaded
  - panic
  - panicked
  - horror
  - horrified
  - alarm
  - alarmed
  - fright
  - frightened
  - scared
  - nervous
  - nervously
  - anxiety
  - anxious
  - apprehension
  - uneasy
  - unease
  - worried
  - worry
  # anger
  - rage
  - enraged
  - fury
  - furious
  - anger
  - angry
  - angrily
  - irritation
  - irritated
  - annoyed
  - annoyance
  - resentment
  - resentful
  - indignation
  - indignant
  - hatred
  - loathing
  - contempt
  - spite
  - bitterness
  - bitterly
  # sadness
  - grief
  - grieving
  - sorrow
  - sorrowful
  - despair
  - despairing
  - misery
  - miserable
  - anguish
  - anguished
  - sadness
