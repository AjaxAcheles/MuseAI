  # Proportion of a beat's sentences that may lean on a stock gesture or
  # abstract shorthand. Raised from 0.15, which was calibrated against 17
  # phrases and is far tighter against 113. If legitimate prose still gets
  # faulted, raise this further rather than gutting the vocabulary.
  tic_phrase_threshold: 0.25
  tic_phrases:
  # observed in this project's own drafts
  - trembling
  - trembled
  - deep breath
  - shaky breath
  - tears welled
  - welled with tears
  - eyes filled with tears
  - traced the handwriting
  - traced the letters
  - traced the words
  - heavy silence
  - silence hung
  - the weight of
  - shared history
  - legacy
  - closure
  - bittersweet
  # stock cardiac / respiratory tells
  - heart pounded
  - heart pounding
  - heart hammered
  - heart raced
  - heart racing
  - heart skipped
  - pulse quickened
  - breath caught
  - breath hitched
  - caught her breath
  - caught his breath
  - let out a breath
  - let out a sigh
  - released a breath
  - exhaled slowly
