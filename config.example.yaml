# MuseAI v1 configuration (example).
# Copy to config.yaml and fill in the endpoint details.
# Unknown or mistyped keys are FATAL at boot (extra keys are forbidden).

project_id: "my-first-book"

# Web UI / server.
host: "127.0.0.1"
port: 8000
log_level: "INFO"

# Local persistence.
db_path: "data/museai.db"
event_log_path: "data/events.jsonl"

# Dev-only reset route guard. Set false outside local development.
allow_reset: true

# Seconds the continuity critic's web_search tool waits on a search engine.
web_search_timeout: 10

# LLM endpoint. Endpoint/model-agnostic: any OpenAI-compatible server works.
endpoint:
  # e.g. "https://api.openai.com/v1" or a local server "http://127.0.0.1:1234/v1"
  base_url: "http://127.0.0.1:1234/v1"
  # ${VAR} is resolved from the environment (.env is loaded automatically).
  api_key: "${MUSEAI_API_KEY}"
  model_name: "your-model-name"
  # "tiktoken" or "char_heuristic" only.
  tokenizer_family: "char_heuristic"
  request_timeout: 60      # connect/write timeout, seconds
  # Max silent gap between streamed chunks, seconds. Separate from
  # request_timeout: a reasoning model legitimately pauses minutes mid-stream.
  stream_read_timeout: 300
  temperature: 0.7
  # Sent as max_tokens when set. Leave null to omit the field — some endpoints
  # bill hidden reasoning against this budget, and some apply a small default
  # cap when it is absent. Truncation (finish_reason "length") is detected and
  # reported either way.
  max_output_tokens: null
  # Merged verbatim into every request body — the escape hatch for server knobs
  # the OpenAI shape has no field for. The important one for small local models
  # is Ollama's context window: its default (a few thousand tokens) is smaller
  # than MuseAI's planner prompts, so generation gets zero room and every reply
  # comes back truncated (finish_reason "length", zero output). Widen it:
  #   extra_body: { options: { num_ctx: 16384 } }
  # Note: some Ollama builds ignore `options` on the /v1 endpoint. The reliable
  # levers are the OLLAMA_CONTEXT_LENGTH env var (e.g. OLLAMA_CONTEXT_LENGTH=16384
  # ollama serve) or a Modelfile `PARAMETER num_ctx 16384`. Leave null to send
  # nothing extra.
  extra_body: null
  # The model's real context window, in tokens. When set, MuseAI trims assembled
  # prompts (planners and drafting) to leave output_reservation tokens free — so
  # a small window never fills up and leaves zero room to generate, whatever the
  # endpoint. Endpoint-agnostic (not just Ollama). Set this to your model's
  # window when running small local models. null = trust the endpoint, no trim.
  context_window: null
  # Minimum tokens kept free for generation under context_window. Prompts are
  # trimmed to leave at least this much room. When context_window is set and
  # max_output_tokens is null, max_tokens is sent as the window's actual
  # remainder after the prompt (at least this value) — so long prose is not
  # capped at the reservation when the window has headroom. Must be < context_window.
  output_reservation: 1024

# Generation shape.
generation:
  word_count_target: 1500      # whole-manuscript stop signal; 0 or empty = no limit (outline decides)
  revision_retry_cap: 3        # max draft->audit->revise cycles per beat
  max_agent_iterations: 6      # max tool-loop steps for any tool-using agent
  recent_prose_beats: 4        # recent committed beats injected as context
  context_token_budget: 8000   # soft token ceiling on the assembled draft context
  passive_voice_threshold: 0.25  # max proportion of passive sentences per beat
  critic_parse_retries: 2        # re-prompts when the critic's JSON will not parse
  critic_degrade_threshold: 3    # consecutive unreadable critics before degrading + warning
  planner_parse_retries: 2       # re-prompts when a planner's JSON will not parse
  repetition_threshold: 0.9      # paragraph similarity (0..1) that counts as duplicated prose
  repetition_min_run: 3          # consecutive near-duplicate sentences before a copy is faulted
  emotion_word_threshold: 0.3    # max proportion of sentences that may name an emotion outright
  planner_intensity_retries: 1   # re-prompts for a varied emotional arc when a plan is all high-arousal
  intensity_hot_threshold: 0.6   # |target arousal| at/above which a beat counts as "hot"
  intensity_flat_fraction: 0.8   # fraction of a chapter's beats that may be hot before re-prompting
  research_mode: false           # offer web_search to the agents; off = story-canon tools only
  tool_call_cap: 6               # max calls to any one tool within a single agent loop
  tool_timeout: 30               # seconds allowed for one tool execution
  # repetition_allowlist: []     # optional: phrases allowed to recur verbatim (author-declared)
  # emotion_words: [...]         # optional: override the named-emotion vocabulary the guard counts
