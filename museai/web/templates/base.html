<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MuseAI{% endblock %}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar-inner">
        <a class="brand" href="/dashboard">Muse<span class="brand-accent">AI</span></a>
        <nav class="app-nav" aria-label="Primary">
          {% for href, label in [("/dashboard", "Studio"), ("/seed", "Seed"), ("/settings", "Settings")] %}
          <a class="app-nav-link{{ ' active' if request.path == href or (href == '/dashboard' and request.path == '/') else '' }}"
             href="{{ href }}"{% if request.path == href %} aria-current="page"{% endif %}>{{ label }}</a>
          {% endfor %}
        </nav>
        <div class="app-bar-status">{% block appbar_status %}{% endblock %}</div>
      </div>
    </header>
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
