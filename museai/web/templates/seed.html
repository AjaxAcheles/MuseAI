{% extends "base.html" %}

{% block title %}MuseAI Seed{% endblock %}

{% block content %}
<div class="page-narrow">
  <header class="page-header">
    <h1 class="page-title">Load a seed</h1>
    <p class="page-subtitle">Project metadata, arcs, threads, and characters. Reloading a seed is safe — writes are idempotent upserts.</p>
  </header>

  {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}

  <form id="seed-form" method="post" action="/seed/submit" class="panel">
    <div class="seed-toolbar">
      <label class="seed-label" for="seed_json">Seed JSON</label>
      <div class="seed-toolbar-actions">
        <button id="seed-format" class="btn btn-sm btn-outline-light" type="button">Format</button>
        <button id="seed-reset" class="btn btn-sm btn-outline-light" type="button">Reset to example</button>
      </div>
    </div>
    <textarea id="seed_json" name="seed_json" class="form-control seed-editor" rows="22"
              spellcheck="false" autocomplete="off">{{ seed_text }}</textarea>
    <p id="seed-validation" class="seed-validation" aria-live="polite"></p>
    <div class="seed-submit-row">
      <button id="seed-submit" class="btn btn-accent" type="submit">Load seed</button>
    </div>
  </form>

  <div id="seed-example" hidden data-example="{{ example_seed }}"></div>
</div>
{% endblock %}
